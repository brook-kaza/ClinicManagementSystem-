server {
    listen 80 default_server;
    server_name _;

    # Serve the React Frontend Build
    root /usr/share/nginx/html;
    index index.html;

    # index.html — never cache so clients always get the latest app after a deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Vite hashed assets (JS/CSS) — long-term cache, content-hash guarantees freshness
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — no cache on dynamic routes
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://clinic-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy requests for uploaded X-Ray images
    location /uploads/ {
        proxy_pass http://clinic-backend:8000;
        proxy_set_header Host $host;
    }
}
